name: xmod release

# Upstream pushes a tag every few minutes, so building every tag would be
# hundreds of releases a day. The six-hour schedule is the throttle: each run
# takes whatever is newest at that moment, puts our commits on top and
# publishes it as xmod-vX with the Windows executable. (One tag in ten also
# ends in 0, and an earlier version of this file waited for those; with the
# schedule already limiting the rate that only made it older and no rarer.)
#
# The release tag does not start with v on purpose: release.yml runs on v*
# and hands off to yetone/magpie-releases, where our signing keys do not
# exist, so a v* tag here would only start a run that fails.
#
# main is an upstream commit plus our commits (the feature and this file).
# Each of ours is cherry-picked onto the chosen tag, and a conflict fails the
# run: a release built from half-applied code is worse than no release.
#
# These builds update themselves, from a feed this file publishes: latest.json
# rides along with every release and is what update.Feed asks for. The feed is
# the fork's, never usemagpie.ai's — that one lists upstream's releases, and
# taking one would swap our monitor out for the official app. The version is a
# plain release number, 0.1.2854+xmod.06ed67cd9: build metadata after "+" takes
# no part in the comparison, so update.Released reads it as a release and
# update.Newer sees exactly 0.1.2854 — the version latest.json names, so a
# build is never newer than itself, and older than the next checkpoint.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (empty: the newest one)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: xmod-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pick the upstream tag
        id: pick
        env:
          WANT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${WANT}" ]; then
            TAG="${WANT}"
          else
            TAG=$(git ls-remote --tags --refs https://github.com/yetone/magpie.git 'v0.1.*' \
              | awk '{print $2}' | sed 's|refs/tags/||' \
              | grep -E '^v0\.1\.[0-9]+$' | sort -V | tail -n 1)
          fi
          test -n "${TAG}" || { echo '::error::no upstream tag matched'; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags --refs origin "xmod-${TAG}" | grep -q .; then
            echo "xmod-${TAG} is already out; nothing to do"
            echo 'skip=yes' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=no' >> "$GITHUB_OUTPUT"
          fi

      - name: Put our commits on that tag
        if: steps.pick.outputs.skip == 'no'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/yetone/magpie.git "+refs/tags/${TAG}:refs/tags/${TAG}"
          # Everything in main the tag does not have is ours, in order: the
          # feature and this workflow. Each one is picked over by itself so a
          # failure names the commit that stopped applying.
          OUR=$(git rev-list --reverse "${TAG}..HEAD")
          test -n "${OUR}" || { echo "::error::main has no commits of ours over ${TAG}"; exit 1; }
          git checkout -B xmod-build "${TAG}"
          for c in ${OUR}; do
            git -c user.name=xmod -c user.email=xmod@users.noreply.github.com \
              cherry-pick "$c" || {
                echo "::error::${c} no longer applies to ${TAG}; it needs a hand rebase"
                exit 1
              }
          done

      - name: Check before publishing
        if: steps.pick.outputs.skip == 'no'
        run: |
          set -euo pipefail
          test -z "$(gofmt -l internal/gateway internal/gui plugins)"
          go vet -tags nogui ./internal/gateway ./internal/gui ./internal/cli ./plugins/...
          # The live feature's own tests, named one by one: a bare "TestLive"
          # also picks up upstream's unrelated tests (TestLiveListsEndpointsRoute,
          # TestLivePromptHasItsWindow, TestLiveVisibleReasoningFixture and
          # TestLiveCodexSealedAgentGuidance), and the first of those flakes here
          # when it shares the run with the rest of the package.
          go test -tags nogui ./internal/gateway -run '^(TestLiveCountsBytesAndContent|TestLiveHeartbeatIsBytesNotContent|TestLiveIsOptional|TestLiveWritesReachTheRoute|TestLiveCountsARealStream|TestCommentOnlyTellsHeartbeatsApart|TestContentBytesPerProtocol|TestContentCounter[A-Za-z]*|TestRates[A-Za-z]*|TestRouteGetsTheEstimateOnlyOnceItIsCalibrated)$'
          go test -tags nogui ./internal/gui -run 'TestBuiltin|TestCoreBudget|TestTranslated'
          # TestEveryRoute is upstream's bookkeeping over every /api route, and
          # upstream ships tags that fail it on their own: v0.1.2840 registers
          # GET /api/context/reply without an entry, and so does their main. Run
          # here, it would fail our build for their gap. Our patch adds no route
          # of its own, so what is checked instead is that the patch itself came
          # through: the two names the feature is built from.
          grep -q 'liveBegin' internal/gateway/gateway.go
          grep -q 'liveCells' internal/gui/assets/plugins/routing/client.js

      - name: Build the Windows executables
        if: steps.pick.outputs.skip == 'no'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          # The version the updater compares: 0.1.2854+xmod.06ed67cd9. What
          # follows "+" is build metadata to update.parse and takes no part in
          # the order, so this is 0.1.2854 — equal to what latest.json says
          # about this very release, so nobody is offered the build they already
          # run, and smaller than the next checkpoint, so that one is offered.
          # Rebuilding the same tag with more of our commits keeps this number:
          # such a build is not handed out, the next upstream tag (hours away)
          # carries the change.
          BASE="${TAG#v}"
          SHA=$(git rev-parse --short HEAD)
          # Upstream's target builds windows/amd64 and windows/arm64 both; the
          # amd64 one is the only one published. Its recipe is left as it is on
          # purpose: a patch to the Makefile (a knob naming the arches, once)
          # stalled a run as soon as upstream edited the lines beside it.
          make release-windows VERSION="${BASE}+xmod.${SHA}"
          echo "built ${BASE}+xmod.${SHA}"

      - name: Write the update feed
        if: steps.pick.outputs.skip == 'no'
        env:
          TAG: ${{ steps.pick.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="${TAG#v}"
          FILE=dist/magpie-windows-amd64.exe
          SIZE=$(stat -c %s "${FILE}")
          SHA256=$(sha256sum "${FILE}" | cut -d' ' -f1)
          # The feed the app reads: the version it compares against its own, the
          # notes it shows, and the file with the SHA-256 it checks before
          # installing — update.download turns down a release that lists none.
          cat > dist/latest.json <<JSON
          {
            "version": "${BASE}",
            "notes": "upstream ${TAG} with our receive monitor on top, built from $(git rev-parse --short HEAD). windows/amd64 only.",
            "url": "https://github.com/${REPO}/releases/tag/xmod-${TAG}",
            "assets": {
              "magpie-windows-amd64.exe": {
                "url": "https://github.com/${REPO}/releases/download/xmod-${TAG}/magpie-windows-amd64.exe",
                "size": ${SIZE},
                "sha256": "${SHA256}"
              }
            }
          }
          JSON
          cat dist/latest.json

      - name: Publish
        if: steps.pick.outputs.skip == 'no'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          set -euo pipefail
          # --latest: the feed is releases/latest/download/latest.json, so this
          # release has to be the one that mark points at even if a delayed run
          # for an older tag publishes afterwards.
          gh release create "xmod-${TAG}" \
            dist/magpie-windows-amd64.exe \
            dist/latest.json \
            --title "${TAG}-xmod" \
            --latest \
            --notes "upstream ${TAG} with our receive monitor on top, built from $(git rev-parse --short HEAD), windows/amd64 only."
